name: Release

on:
  push:
    branches:
      - main

# A newer commit on main cancels an older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-release:
    name: Build, push and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required for the sequential commit count.
          fetch-depth: 0

      - name: Compute sequential version
        id: version
        run: |
          COUNT="$(git rev-list --count HEAD)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Image tag: $COUNT | Release tag: v$COUNT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the repository name automatically.
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.count }}
          labels: |
            org.opencontainers.image.title=Fast-Frame
            org.opencontainers.image.description=GPU-accelerated video speed and processing studio
            org.opencontainers.image.version=${{ steps.version.outputs.count }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.count }}
          name: v${{ steps.version.outputs.count }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Docker image published to GHCR:

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.count }}
            ```

            Also available as `${{ env.IMAGE_NAME }}:latest`.
