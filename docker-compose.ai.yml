# AI auto-framing helper overlay (Phase 9).
#
# The default image now ships the YOLO runtime and downloads the ONNX weights
# on first detection, so this overlay is only useful to pin a specific model
# file: it mounts ./models read-only and points AI_TRACKING_MODEL at it.
#
# Export weights once on any machine with Python:
#   pip install ultralytics
#   yolo export model=yolo11n.pt format=onnx
#   copy yolo11n.onnx models/           # PowerShell
#   cp yolo11n.onnx models/             # bash
#
# Then start the stack with:
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
services:
  fast-frame:
    environment:
      AI_TRACKING_BACKEND: auto
      AI_TRACKING_MODEL: /models/yolo11n.onnx
    volumes:
      - ./models:/models:ro