# AI helper overlay (Phases 9–11).
#
# The default image ships the ONNX runtime and downloads both models on first
# use, so this overlay is only useful to pin specific model files: it mounts
# ./models read-only and points the services at them.
#
# Export/prepare the files once:
#   pip install ultralytics
#   yolo export model=yolo11s.pt format=onnx
#   copy yolo11s.onnx models\                              # PowerShell
#   curl -L -o models\midas-v21-small.onnx `
#     https://github.com/isl-org/MiDaS/releases/download/v2_1/model-small.onnx
#
# Then start the stack with:
#   docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d
services:
  fast-frame:
    environment:
      AI_TRACKING_BACKEND: auto
      AI_TRACKING_MODEL: /models/yolo11s.onnx
      AI_DEPTH_MODEL: /models/midas-v21-small.onnx
    volumes:
      - ./models:/models:ro