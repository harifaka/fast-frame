services:
  fast-frame:
    build:
      context: .
      dockerfile: Dockerfile
    # Same name the CI pipeline publishes to, so a locally built image and the
    # pre-built GHCR image are interchangeable. Pin a release with
    # FAST_FRAME_TAG=<count>:
    #   docker compose pull && docker compose up -d   # use the released image
    #   docker compose up --build -d                  # build locally
    image: ghcr.io/harifaka/fast-frame:${FAST_FRAME_TAG:-latest}
    container_name: fast-frame
    restart: unless-stopped
    ports:
      # Bind all interfaces so Windows 10/11 LAN devices can reach the studio.
      - "0.0.0.0:8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      HOST_MOUNT_PATH: /mnt/host
      # SMB/CIFS shares are mounted (or relayed) below this directory.
      NETWORK_MOUNT_PATH: /mnt/host/network
      # Loopback base URL used to hand non-mounted NAS files to ffmpeg/ffprobe.
      FASTFRAME_INTERNAL_URL: http://127.0.0.1:8000
    volumes:
      # Docker Desktop (WSL2): the whole host filesystem, i.e. every Windows
      # drive (c, d, e) and USB drive, with no .env or compose edit required.
      - /run/desktop/mnt/host:/mnt/host/drives
      # Direct fallback access to the main Windows C: drive.
      - C:/:/mnt/host/c
      # Portable default: anything dropped into ./media shows up under /mnt/host/media.
      - ./media:/mnt/host/media
      # Kernel-level SMB mounts live here; a volume keeps them off your media folders.
      - fast-frame-network:/mnt/host/network
      # Linux hosts: replace the two Windows mounts above with e.g.
      # - /media:/mnt/host/media
      # - /run/media:/mnt/host/run-media
    gpus: all
    # SMB/CIFS shares are read through a pure-Python client by default. To let
    # the container create kernel `mount.cifs` mounts instead (true zero-copy
    # paths for every tool), uncomment the capability below.
    # cap_add:
    #   - SYS_ADMIN
    # Older Compose releases that do not understand `gpus:` can use this instead:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  fast-frame-network:
