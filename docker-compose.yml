services:
  fast-frame:
    build:
      context: .
      dockerfile: Dockerfile
    image: fast-frame:latest
    container_name: fast-frame
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      HOST_MOUNT_PATH: /mnt/host
    volumes:
      # Portable default: anything dropped into ./media shows up under /mnt/host/media.
      - ./media:/mnt/host/media
      # Windows (Docker Desktop + WSL2) - map a whole drive:
      # - D:/:/mnt/host/d
      # Linux - map removable / media drives:
      # - /media:/mnt/host/media
      # - /run/media:/mnt/host/run-media
    gpus: all
    # Older Compose releases that do not understand `gpus:` can use this instead:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
